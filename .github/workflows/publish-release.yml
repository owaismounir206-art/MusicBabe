name: Publish Release

# Builds the signed release APKs of a commit and publishes them as a GitHub Release (tag + assets).
# Signing: the KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets when set;
# otherwise a CI release key kept in the Actions cache (created on the first run).
# GitHub drops a cache that is not used for 7 days: the phone debug build touches the key so it
# stays, and a release whose certificate differs from the previous release's is refused (phones
# reject such an update as "not compatible"), unless allow_new_signing_key is set on purpose.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.8.0 (the tag is v<version>)'
        required: true
      commit:
        description: 'Commit or branch to release'
        required: true
        default: 'main'
      allow_new_signing_key:
        description: 'Publish even if the signing certificate differs from the last release (users must reinstall)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install CMake and NDK
        run: |
          SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -n 1)/sdkmanager"
          yes | "$SDKM" --install "cmake;3.31.6" "ndk;29.0.14206865" > /dev/null

      - name: Restore CI release key
        id: ci-key
        uses: actions/cache@v5
        with:
          path: ci-release-key.jks
          key: musicbabe-ci-release-key-v1

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > vz-pixelplay.jks
            printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          else
            if [ ! -f ci-release-key.jks ]; then
              keytool -genkey -noprompt -keystore ci-release-key.jks -alias musicbabe -keyalg RSA -keysize 4096 -validity 10000 \
                -storepass musicbabe-ci -keypass musicbabe-ci -dname "CN=MusicBabe, O=MusicBabe, C=IT"
            fi
            cp ci-release-key.jks vz-pixelplay.jks
            printf 'storePassword=musicbabe-ci\nkeyAlias=musicbabe\nkeyPassword=musicbabe-ci\n' > keystore.properties
          fi

      - name: Build release APKs
        run: gradle :app:assembleRelease -Ppixelplay.enableAbiSplits=true

      - name: Verify and rename APKs
        run: |
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a; do
            apk="app/build/outputs/apk/release/app-$abi-release.apk"
            "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$apk"
            cp "$apk" "dist/MusicBabe-${{ inputs.version }}-$abi.apk"
          done

      - name: Same signing certificate as the last release
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_NEW_KEY: ${{ inputs.allow_new_signing_key }}
        run: |
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          cert() { "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$1" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}'; }
          prev_tag="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty' || true)"
          if [ -z "$prev_tag" ]; then echo "First release: nothing to compare."; exit 0; fi
          mkdir -p prev
          if ! gh release download "$prev_tag" --pattern '*arm64-v8a.apk' --dir prev; then
            echo "::warning::Could not download $prev_tag to compare certificates."; exit 0
          fi
          old="$(cert "$(ls prev/*.apk | head -n 1)")"
          new="$(cert dist/*-arm64-v8a.apk)"
          echo "Previous ($prev_tag): $old"
          echo "This build:            $new"
          if [ "$old" != "$new" ]; then
            if [ "$ALLOW_NEW_KEY" = "true" ]; then
              echo "::warning::New signing certificate: users must uninstall the old version before installing this one."
            else
              echo "::error::The signing certificate differs from $prev_tag (the CI key was lost). Phones would refuse the update. Set the KEYSTORE_* secrets or rerun with allow_new_signing_key."
              exit 1
            fi
          fi

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="${{ inputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {on=1; print; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "MusicBabe ${{ inputs.version }}" > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" dist/*.apk \
            --target "$(git rev-parse HEAD)" \
            --title "MusicBabe ${{ inputs.version }}" \
            --notes-file notes.md
